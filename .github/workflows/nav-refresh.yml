name: Monthly NAV refresh

on:
  schedule:
    # 18th of each month, 09:00 UTC (04:00 CT) - after most funds publish
    - cron: '0 9 18 * *'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Scrape fund sources for new NAVs
        run: python scrape_nav.py

      - name: Commit updated data
        run: |
          git config user.name "nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          if git diff --quiet nav-data.json; then
            echo "No NAV changes - nothing to commit."
          else
            git add nav-data.json
            git commit -m "NAV refresh $(date -u +%F)"
            git push
          fi
