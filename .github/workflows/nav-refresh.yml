name: Daily data refresh

on:
  schedule:
    # Daily 09:00 UTC (04:00 CT, pre-market): refresh prices every day,
    # NAVs update whenever the funds publish (usually mid-month)
    - cron: '0 9 * * *'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh NAVs and prices
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python scrape_nav.py

      - name: Commit updated data
        run: |
          git config user.name "nav-bot"
          git config user.email "nav-bot@users.noreply.github.com"
          if git diff --quiet nav-data.json; then
            echo "No changes - nothing to commit."
          else
            git add nav-data.json
            git commit -m "Data refresh $(date -u +%F)"
            git push
          fi
